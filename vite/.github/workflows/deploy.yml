name: Build & Deploy to Coolify

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'develop' }}

    permissions:
      contents: read

    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY_NORMALIZED="${REGISTRY#http://}"
          REGISTRY_NORMALIZED="${REGISTRY_NORMALIZED#https://}"
          REGISTRY_NORMALIZED="${REGISTRY_NORMALIZED%/}"

          IMAGE="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_IMAGE="${REGISTRY_NORMALIZED}/${OWNER}/${IMAGE}"

          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAGS="${FULL_IMAGE}:latest"
            TAGS="${TAGS}"$'\n'"${FULL_IMAGE}:production-${SHORT_SHA}"
          else
            TAGS="${FULL_IMAGE}:develop"
          fi

          {
            echo "registry=${REGISTRY_NORMALIZED}"
            echo "image=${FULL_IMAGE}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create environment file
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::ENV_FILE is empty"
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ENV_FILE_HASH=${{ hashFiles('.env') }}
          secret-files: |
            app_env=.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove environment file
        if: always()
        shell: bash
        run: rm -f .env

      - name: Trigger Coolify Deploy
        shell: bash
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${COOLIFY_WEBHOOK:-}" || {
            echo "::error::COOLIFY_WEBHOOK is empty"
            exit 1
          }

          test -n "${COOLIFY_TOKEN:-}" || {
            echo "::error::COOLIFY_TOKEN is empty"
            exit 1
          }

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
